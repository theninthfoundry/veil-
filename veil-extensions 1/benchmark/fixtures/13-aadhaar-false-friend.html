<!DOCTYPE html>
<!--
  Adversarial fixture: stress-tests the overlap-arbitration logic the
  project's own README already flags as a known sharp edge (a 12-digit
  number is Aadhaar-shaped regardless of what it actually represents). This
  order-tracking ID is a plain sequential internal reference number, not a
  government ID, formatted identically to an Aadhaar number (4-4-4 grouped
  12 digits). A detector that flags ANY 12-digit grouped number as Aadhaar
  without considering context (label text, field purpose) will produce a
  false positive here — included specifically so this trade-off is measured
  and documented, not left as an unmeasured known limitation.
-->
<html lang="en">
<head><meta charset="UTF-8"><title>Fixture 13 — Aadhaar false friend</title></head>
<body>
  <main>
    <h1>Track your shipment</h1>
    <p>Tracking reference: 1234 5678 9012</p>
    <p>Enter this reference number at the courier's site to see live status.
       This is an internal order-tracking ID, not a personal identifier.</p>
  </main>
</body>
</html>
