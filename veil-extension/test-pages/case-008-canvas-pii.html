<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level C — HTML5 Canvas Raster PII (Case #008)</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0e14; color: #f0f6fc; padding: 28px; }
  .box { max-width: 600px; margin: 0 auto; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; }
  .badge { background: rgba(240, 136, 62, 0.15); color: #f0883e; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
  canvas { background: #000; border: 1px solid #30363d; border-radius: 8px; width: 100%; height: 180px; margin: 16px 0; }
  .btn-verify { background: #238636; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h2>ISRO Restricted Area Digital Badge</h2>
      <span class="badge">CASE #008: CANVAS PII</span>
    </div>
    <p style="color: #8b949e; font-size: 13px;">
      <b>Evaluation Condition</b>: Rendered into an HTML5 <code>&lt;canvas&gt;</code> context. DOM contains 0 text elements.
    </p>

    <canvas id="idBadgeCanvas" width="550" height="180"></canvas>
    <button class="btn-verify" id="grantAccessBtn">Authorize Facility Entry</button>
  </div>

  <script>
    const canvas = document.getElementById('idBadgeCanvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#1f2937';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#38d39f';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('ISRO SATELLITE INTEGRATION CENTRE', 20, 35);

    ctx.fillStyle = '#ffffff';
    ctx.font = '14px monospace';
    ctx.fillText('Scientist: Dr. Vikram Sarabhai', 20, 70);
    ctx.fillText('Identity ID: ISRO-SC-889102', 20, 95);
    ctx.fillText('Security Token: SECRET_TOKEN_9921', 20, 120);

    ctx.fillStyle = '#ff7b72';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('RESTRICTED ACCESS LEVEL 4', 20, 155);
  </script>
</body>
</html>
