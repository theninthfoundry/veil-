<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level B — Flagship E-Commerce Store (Case #002)</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0e14; color: #f0f6fc; padding: 32px; }
  .checkout-card { max-width: 640px; margin: 0 auto; background: #151922; border: 1px solid #2d3748; border-radius: 12px; padding: 28px; }
  .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3748; padding-bottom: 16px; margin-bottom: 20px; }
  .badge-pvt { background: rgba(56, 211, 159, 0.15); color: #38d39f; border: 1px solid #38d39f; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 4px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; color: #8b949e; margin-bottom: 6px; }
  input, textarea { width: 100%; box-sizing: border-box; background: #090c10; border: 1px solid #30363d; border-radius: 6px; padding: 10px 12px; color: #f0f6fc; font-size: 13px; }
  input:focus, textarea:focus { outline: none; border-color: #58a6ff; }
  .price-summary { display: flex; justify-content: space-between; font-size: 16px; font-weight: 800; color: #38d39f; margin: 24px 0 16px; padding-top: 16px; border-top: 1px dashed #30363d; }
  .btn-pay { width: 100%; background: #238636; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 800; cursor: pointer; transition: background 0.2s; }
  .btn-pay:hover { background: #2ea043; }
  .order-status { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; font-weight: 700; text-align: center; }
  .order-status.success { display: block; background: rgba(56, 211, 159, 0.2); color: #38d39f; border: 1px solid #38d39f; }
</style>
</head>
<body>
  <div class="checkout-card">
    <div class="header-row">
      <h2>ISRO Avionics &amp; Sensor Store</h2>
      <span class="badge-pvt">CASE #002: CHECKOUT</span>
    </div>

    <form id="checkoutForm" onsubmit="event.preventDefault(); document.getElementById('statusBox').className='order-status success'; document.getElementById('statusBox').textContent='✔ Order Confirmed! ₹4,999 Charged safely via VEIL Vault.';">
      <div class="form-group">
        <label for="fullName">Customer Name</label>
        <input type="text" id="fullName" name="fullName" value="Test User" autocomplete="name">
      </div>

      <div class="form-group">
        <label for="emailAddr">Email Address</label>
        <input type="email" id="emailAddr" name="email" value="test.user@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="cardNumber">Credit Card Number</label>
        <input type="text" id="cardNumber" name="cardNumber" value="4111 1111 1111 1111" autocomplete="cc-number">
      </div>

      <div class="form-group">
        <label for="shippingAddress">Shipping Address</label>
        <textarea id="shippingAddress" name="shippingAddress" rows="2" autocomplete="street-address">Flat 402, High-Tech City, Hyderabad</textarea>
      </div>

      <div class="price-summary">
        <span>Total Payable</span>
        <span>₹4,999.00</span>
      </div>

      <button type="submit" class="btn-pay" id="completePurchaseBtn">Complete Purchase ₹4,999</button>
      <div id="statusBox" class="order-status"></div>
    </form>
  </div>
</body>
</html>
