<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Patient intake</title></head>
<body>
  <h1>Patient intake</h1>
  <form>
    <label>Patient name<input name="patient_name" autocomplete="name" type="text"></label>
    <label>Phone<input name="phone" type="tel"></label>
    <label>Home address<input name="address" autocomplete="street-address" type="text"></label>
    <label>Insurance policy number<input name="policy_number" type="text"></label>
    <button type="submit">Continue</button>
  </form>
</body>
</html>
