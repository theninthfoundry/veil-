<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkout</title></head>
<body>
  <h1>Checkout</h1>
  <form>
    <label>Quantity<input name="quantity" type="number" value="1"></label>
    <label>Full name<input name="fullname" autocomplete="name" type="text"></label>
    <label>Email<input name="email" type="email"></label>
    <label>Card number<input name="card_number" autocomplete="cc-number" type="text"></label>
    <label>CVV<input name="cvv" autocomplete="cc-csc" type="text"></label>
    <label>Shipping address<input name="address" autocomplete="street-address" type="text"></label>
    <button type="submit">Place order</button>
  </form>
</body>
</html>
