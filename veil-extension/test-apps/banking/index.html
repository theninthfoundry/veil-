<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ApexNet — Priority Banking Portal</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b132b; color: #f8fafc; padding: 32px; }
    .container { max-width: 650px; margin: 0 auto; background: #1c2541; padding: 28px; border-radius: 12px; border: 1px solid #3a506b; }
    h1 { font-size: 22px; color: #48cae4; }
    .acc-card { background: #0b132b; padding: 16px; border-radius: 8px; border: 1px solid #3a506b; margin: 16px 0; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    input, select { width: 100%; box-sizing: border-box; padding: 10px; background: #0b132b; border: 1px solid #3a506b; border-radius: 6px; color: #fff; font-size: 13px; }
    .btn-transfer { width: 100%; padding: 14px; background: linear-gradient(135deg, #0077b6, #0096c7); border: none; border-radius: 8px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ApexNet Priority Banking</h1>
    <div class="acc-card">
      <div>Account Number: <strong>XXXX-XXXX-8921</strong> (Primary Savings)</div>
      <div style="font-size: 18px; font-weight: 700; color: #48cae4; margin-top: 6px;">Available Balance: ₹1,42,850.00</div>
    </div>

    <h3>Instant IMPS / NEFT Money Transfer</h3>
    <form id="transferForm" onsubmit="event.preventDefault(); alert('Transfer Initiated!');">
      <div class="form-group">
        <label for="beneficiaryName">Beneficiary Full Name</label>
        <input type="text" id="beneficiaryName" value="Namrata Sharma">
      </div>
      <div class="form-group">
        <label for="beneficiaryAccount">Beneficiary Account Number</label>
        <input type="text" id="beneficiaryAccount" value="50100234891234">
      </div>
      <div class="form-group">
        <label for="ifscCode">IFSC Code</label>
        <input type="text" id="ifscCode" value="HDFC0001234">
      </div>
      <div class="form-group">
        <label for="transferAmount">Transfer Amount (₹)</label>
        <input type="number" id="transferAmount" value="10000">
      </div>
      <div class="form-group">
        <label for="userPan">Account Holder PAN (for ₹10k+ statutory audit)</label>
        <input type="text" id="userPan" value="ABCDE1234F">
      </div>

      <button type="submit" id="btnTransferMoney" class="btn-transfer">Transfer ₹10,000 via IMPS</button>
    </form>
  </div>
</body>
</html>
