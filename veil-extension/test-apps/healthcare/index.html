<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AeroCare Clinical — Patient Electronic Health Record</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #064e3b; color: #f8fafc; padding: 32px; }
    .container { max-width: 650px; margin: 0 auto; background: #065f46; padding: 28px; border-radius: 12px; border: 1px solid #047857; }
    h1 { font-size: 22px; color: #a7f3d0; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #d1fae5; margin-bottom: 4px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; background: #064e3b; border: 1px solid #047857; border-radius: 6px; color: #fff; font-size: 13px; }
    .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #059669, #10b981); border: none; border-radius: 8px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AeroCare Clinical Patient Intake</h1>
    <p style="color: #d1fae5; font-size: 13px;">Confidential Electronic Health Record (EHR)</p>

    <form id="healthForm" onsubmit="event.preventDefault(); alert('Record Saved!');">
      <div class="form-group">
        <label for="patientName">Patient Full Name</label>
        <input type="text" id="patientName" value="Kavita Reddy">
      </div>
      <div class="form-group">
        <label for="patientDob">Date of Birth</label>
        <input type="text" id="patientDob" value="14/08/1992">
      </div>
      <div class="form-group">
        <label for="emergencyPhone">Emergency Contact Phone</label>
        <input type="tel" id="emergencyPhone" value="+91 91234-56789">
      </div>
      <div class="form-group">
        <label for="medicalHistory">Clinical Diagnosis &amp; Prescriptions</label>
        <textarea id="medicalHistory" rows="3">Type-2 Diabetes mellitus under Metformin 500mg daily. No known drug allergies.</textarea>
      </div>

      <button type="submit" id="btnSaveHealthRecord" class="btn-submit">Save Clinical Record</button>
    </form>
  </div>
</body>
</html>
