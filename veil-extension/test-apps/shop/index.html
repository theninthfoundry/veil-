<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AeroStore — Premium Tech &amp; Hardware</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 32px; }
    .container { max-width: 650px; margin: 0 auto; background: #1e293b; padding: 28px; border-radius: 12px; border: 1px solid #334155; }
    h1 { font-size: 22px; margin-bottom: 8px; color: #38bdf8; }
    .item-card { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 16px; border-radius: 8px; margin: 16px 0; border: 1px solid #334155; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 4px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 13px; }
    .btn-buy { width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; }
    .total-box { font-size: 18px; font-weight: 700; text-align: right; color: #38bdf8; margin: 16px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AeroStore Flagship Checkout</h1>
    <p style="color: #94a3b8; font-size: 13px;">Complete your purchase with automated shipping and secure billing.</p>

    <div class="item-card">
      <div>
        <strong>AeroPulse Noise-Cancelling Spatial Headset</strong>
        <div style="font-size: 12px; color: #94a3b8;">Color: Midnight Obsidian • Qty: 1</div>
      </div>
      <div style="font-size: 16px; font-weight: 700; color: #38bdf8;">₹4,999.00</div>
    </div>

    <form id="checkoutForm" onsubmit="event.preventDefault(); alert('Order Placed!');">
      <div class="form-group">
        <label for="fullName">Full Customer Name</label>
        <input type="text" id="fullName" autocomplete="name" value="Test User">
      </div>
      <div class="form-group">
        <label for="emailAddr">Email Address</label>
        <input type="email" id="emailAddr" autocomplete="email" value="test.user@example.com">
      </div>
      <div class="form-group">
        <label for="phoneNum">Phone Number</label>
        <input type="tel" id="phoneNum" autocomplete="tel" value="+91 98765-43210">
      </div>
      <div class="form-group">
        <label for="shippingAddress">Delivery Shipping Address</label>
        <input type="text" id="shippingAddress" autocomplete="street-address" value="Plot 42, Hitech City, Hyderabad, 500081">
      </div>
      <div class="form-group">
        <label for="cardNum">Payment Card Number</label>
        <input type="text" id="cardNum" autocomplete="cc-number" value="4111 2222 3333 4444">
      </div>
      <div class="form-group">
        <label for="cardCvv">CVV</label>
        <input type="password" id="cardCvv" placeholder="CVV" value="892" style="width: 100px;">
      </div>

      <div class="total-box">Total Payable: ₹4,999.00</div>

      <button type="submit" id="btnPlaceOrder" class="btn-buy">Place Order ₹4,999</button>
    </form>
  </div>
</body>
</html>
